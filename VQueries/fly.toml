app = "cq"
primary_region = "waw"

[build]
  dockerfile = "VQueries/Dockerfile"

[env]
  ASPNETCORE_ENVIRONMENT = "Alpha"
  ASPNETCORE_HTTP_PORTS = "8080"
  DOTNET_gcServer = "0"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
